
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PowerFuel Gym Store</title>
  <style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-sans);}
:root{
  --pf-orange:#ff3c00;
  --pf-dark:#111;
  --pf-card:#1c1c1c;
}
.pf-wrap{
  background:#111;
  min-height:600px;
  border-radius:var(--border-radius-lg);
  overflow:hidden;color:#fff;}
.pf-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 24px;
  background:#000;
  border-bottom:1px solid #222;}
.pf-logo{
  color:var(--pf-orange);
  font-size:20px;
  font-weight:700;
  letter-spacing:1px;}
.pf-nav{
  display:flex;gap:4px;
}
.pf-nav button{
  background:transparent;
  border:none;
  color:#aaa;
  font-size:13px;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
  font-family:var(--font-sans);
  transition:.2s;}
.pf-nav button:hover,.pf-nav button.active{
  color:#fff;
  background:#1a1a1a;
}
.pf-nav button.active{
  color:var(--pf-orange);
}
.cart-badge{
  background:var(--pf-orange);
  color:#fff;font-size:10px;
  border-radius:50%;
  padding:1px 5px;
  margin-left:4px;
  vertical-align:middle;
}
.pf-section{
  display:none;
  padding:32px 24px;
  animation:pfFade .3s;
}
.pf-section.active{display:block;}
@keyframes pfFade{from{opacity:0;
  transform:translateY(6px);
}to{opacity:1;
  transform:translateY(0);}}

.home-hero{
  text-align:center;
  padding:40px 20px;}
.home-hero h1{
  font-size:36px;
  font-weight:700;
  color:var(--pf-orange);
  line-height:1.2;
  margin-bottom:12px;
}
.home-hero p{
  color:#aaa;
  font-size:15px;
  margin-bottom:28px;
}
.stats-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:32px;
}
.stat-box{
  background:#1c1c1c;
  border-radius:10px;
  padding:16px;
  text-align:center;
}
.stat-num{
  font-size:24px;
  font-weight:700;
  color:var(--pf-orange);
}
.stat-lbl{font-size:12px;color:#777;margin-top:4px;}

.prod-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}
.prod-search{
  width:100%;
  padding:10px 14px;
  background:#1c1c1c;
  border:1px solid #333;
  border-radius:8px;
  color:#fff;
  font-size:14px;
  margin-bottom:18px;
  font-family:var(--font-sans);
}
.prod-search::placeholder{
  color:#555;
}
.prod-search:focus{
  outline:none;
  border-color:var(--pf-orange);
}
.p-card{
  background:#1c1c1c;
  border-radius:10px;
  padding:14px;
  text-align:center;
  transition:.3s;
  border:1px solid #222;
  cursor:pointer;}
.p-card:hover{
  transform:translateY(-4px);
  border-color:var(--pf-orange);
}
.p-card .p-emoji{
  font-size:42px;
  margin-bottom:8px;}
.p-card .p-image{
  width:100%;height:200px;
  object-fit:cover;border-radius:8px;
  margin-bottom:8px;
  background:#0a0a0a;
  display:flex;align-items:center;
  justify-content:center;}
.p-card .p-image img{
  width:100%;height:100%;
  object-fit:cover;border-radius:6px;}
.p-card h3{font-size:13px;
  font-weight:500;color:#fff;
  margin-bottom:4px;}
.p-card .p-price{font-size:15px;
  font-weight:700;color:var(--pf-orange);margin-bottom:10px;}
.p-card .p-cat{font-size:10px;color:#666;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;}
.add-btn{background:var(--pf-orange);color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:12px;cursor:pointer;font-family:var(--font-sans);transition:.2s;width:100%;}
.add-btn:hover{background:#e03500;}
.add-btn.added{background:#27ae60;}
.add-btn.added::before{content:"✓ ";}
.p-card.hidden{display:none;}

.cart-empty{text-align:center;padding:60px 20px;color:#555;}
.cart-empty i{font-size:48px;display:block;margin-bottom:12px;}
.cart-item-row{display:flex;align-items:center;background:#1c1c1c;border-radius:8px;padding:12px 14px;margin-bottom:10px;gap:12px;}
.ci-emoji{font-size:24px;}
.ci-name{flex:1;font-size:14px;color:#ddd;}
.ci-price{font-size:14px;color:var(--pf-orange);font-weight:600;min-width:60px;text-align:right;}
.qty-ctrl{display:flex;align-items:center;gap:8px;}
.qty-btn{background:#2a2a2a;border:none;color:#fff;width:26px;height:26px;border-radius:5px;cursor:pointer;font-size:16px;line-height:1;font-family:var(--font-sans);}
.qty-btn:hover{background:#ff3c00;}
.qty-num{font-size:14px;min-width:20px;text-align:center;}
.rm-btn{background:transparent;border:none;color:#555;cursor:pointer;font-size:18px;padding:0 4px;}
.rm-btn:hover{color:#e74c3c;}
.cart-footer{border-top:1px solid #222;margin-top:16px;padding-top:16px;display:flex;justify-content:space-between;align-items:center;}
.cart-total-label{color:#aaa;font-size:14px;}
.cart-total-val{font-size:22px;font-weight:700;color:#fff;}
.checkout-btn{background:var(--pf-orange);color:#fff;border:none;border-radius:8px;padding:12px 28px;font-size:15px;cursor:pointer;font-family:var(--font-sans);transition:.2s;}
.checkout-btn:hover{background:#e03500;}
.checkout-btn:disabled{background:#555;cursor:not-allowed;}

.login-wrap{max-width:360px;margin:0 auto;background:#1c1c1c;border-radius:12px;padding:28px 24px;border:1px solid #2a2a2a;}
.login-wrap h2{text-align:center;margin-bottom:20px;font-size:20px;font-weight:600;}
.pf-input{width:100%;padding:10px 14px;background:#111;border:1px solid #333;border-radius:7px;color:#fff;font-size:14px;margin-bottom:12px;font-family:var(--font-sans);}
.pf-input::placeholder{color:#555;}
.pf-input:focus{outline:none;border-color:var(--pf-orange);}
.login-btn{width:100%;background:var(--pf-orange);color:#fff;border:none;border-radius:7px;padding:11px;font-size:15px;cursor:pointer;font-family:var(--font-sans);margin-top:4px;}
.login-btn:hover{background:#e03500;}
.login-msg{font-size:13px;text-align:center;margin-top:10px;min-height:18px;}
.login-msg.ok{color:#27ae60;}
.login-msg.err{color:#e74c3c;}
.user-greeted{text-align:center;padding:20px;color:#aaa;}
.user-greeted .ug-name{color:var(--pf-orange);font-size:20px;font-weight:700;}
.logout-link{color:#555;font-size:13px;cursor:pointer;text-decoration:underline;margin-top:8px;display:inline-block;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--pf-orange);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.order-success{text-align:center;padding:40px 20px;}
.order-success .os-icon{font-size:64px;margin-bottom:12px;}
.order-success h2{color:#27ae60;font-size:22px;margin-bottom:8px;}
.order-success p{color:#aaa;font-size:14px;}
.order-success button{margin-top:20px;background:var(--pf-orange);color:#fff;border:none;border-radius:8px;padding:10px 24px;cursor:pointer;font-size:14px;font-family:var(--font-sans);}
  </style>
</head>
<body>

<div class="pf-wrap">
  <div class="pf-header">
    <div class="pf-logo">PowerFuel</div>
    <nav class="pf-nav">
      <button onclick="goTab('home')" id="btn-home" class="active">Home</button>
      <button onclick="goTab('products')" id="btn-products">Products</button>
      <button onclick="goTab('cart')" id="btn-cart">Cart <span class="cart-badge" id="cart-badge" style="display:none">0</span></button>
      <button onclick="goTab('login')" id="btn-login">Login</button>
    </nav>
  </div>

  <div class="pf-section active" id="sec-home">
    <div class="home-hero">
      <h1>Fuel Your Gains </h1>
      <p>Premium gym supplements & natural foods — trusted by 12,000+ athletes.</p>
      <button class="checkout-btn" onclick="goTab('products')">Shop Now →</button>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-num" id="s1">0</div><div class="stat-lbl">Products</div></div>
        <div class="stat-box"><div class="stat-num" id="s2">0</div><div class="stat-lbl">Customers</div></div>
        <div class="stat-box"><div class="stat-num" id="s3">0</div><div class="stat-lbl">Orders placed</div></div>
      </div>
    </div>
  </div>

  <div class="pf-section" id="sec-products">
    <input class="prod-search" placeholder="Search products…" id="prod-search" oninput="filterProds(this.value)">
    <div class="prod-grid" id="prod-grid"></div>
  </div>

  <div class="pf-section" id="sec-cart">
    <h2 style="color:var(--pf-orange);font-size:18px;margin-bottom:16px;">Your Cart</h2>
    <div id="cart-body"></div>
  </div>

  <div class="pf-section" id="sec-login">
    <div id="login-area"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PRODUCTS=[
  {id:'p1',name:'Whey Protein',price:2499,image:'images/Whey protein (2).jpeg',cat:'Protein'},
  {id:'p2',name:'Mass Gainer',price:1999,image:'images/Gainer.jpeg',cat:'Protein'},
  {id:'p3',name:'Creatine',price:1499,image:'images/Creatine.jpeg',cat:'Performance'},
  {id:'p4',name:'Fish Oil',price:999,image:'images/fish oil.jpeg',cat:'Vitamins'},
  {id:'p5',name:'Munthiri',price:1299,image:'images/Munthiri.jpeg',cat:'Natural Foods'},
  {id:'p6',name:'Badam',price:1399,image:'images/Badam.jpeg',cat:'Natural Foods'},
  {id:'p7',name:'Oats',price:499,image:'images/Oats.jpeg',cat:'Natural Foods'},
  {id:'p8',name:'Peanut Butter',price:299,image:'images/Peanut Butter.jpeg',cat:'Natural Foods'},
  {id:'p9',name:'Dates',price:359,image:'images/Dates.jpeg',cat:'Natural Foods'},
];

let cart={};
let loggedIn=false;
let username='';
let orderPlaced=false;

function inr(n){return '₹'+n.toLocaleString('en-IN');}

function goTab(t){
  ['home','products','cart','login'].forEach(s=>{
    document.getElementById('sec-'+s).classList.remove('active');
    document.getElementById('btn-'+s).classList.remove('active');
  });
  document.getElementById('sec-'+t).classList.add('active');
  document.getElementById('btn-'+t).classList.add('active');
  if(t==='cart') renderCart();
  if(t==='login') renderLogin();
  if(t==='home') animateStats();
}

function renderProducts(){
  const g=document.getElementById('prod-grid');
  g.innerHTML=PRODUCTS.map(p=>`
    <div class="p-card" id="card-${p.id}">
      <div class="p-image">
        <img src="${p.image}" alt="${p.name}" onerror="this.parentElement.innerHTML='<div class=p-emoji>${p.emoji}</div>'">
      </div>
      <div class="p-cat">${p.cat}</div>
      <h3>${p.name}</h3>
      <div class="p-price">${inr(p.price)}</div>
      <button class="add-btn ${cart[p.id]?'added':''}" id="ab-${p.id}" onclick="toggleCart('${p.id}')">
        ${cart[p.id]?'In Cart':'Add to Cart'}
      </button>
    </div>`).join('');
}

function toggleCart(id){
  const p=PRODUCTS.find(x=>x.id===id);
  if(cart[id]){
    delete cart[id];
    toast(p.name+' removed');
  } else {
    cart[id]=1;
    toast(p.name+' added ✓');
  }
  updateBadge();
  const btn=document.getElementById('ab-'+id);
  if(btn){
    btn.textContent=cart[id]?'In Cart':'Add to Cart';
    btn.className='add-btn'+(cart[id]?' added':'');
  }
}

function updateBadge(){
  const total=Object.values(cart).reduce((a,b)=>a+b,0);
  const b=document.getElementById('cart-badge');
  b.textContent=total;
  b.style.display=total?'inline-block':'none';
}

function renderCart(){
  const el=document.getElementById('cart-body');
  if(orderPlaced){
    el.innerHTML=`<div class="order-success">
      <h2>Order Confirmed!</h2>
      <p>Your order #PF${Math.floor(Math.random() * 9000 + 1000)} has been placed successfully.</p>
      <button onclick="orderPlaced=false;renderCart()">Continue Shopping</button>
    </div>`;
    return;
  }
  const keys=Object.keys(cart);
  if(!keys.length){
    el.innerHTML=`<div class="cart-empty"><i class="ti ti-shopping-cart" aria-hidden="true"></i><p>Your cart is empty</p><p style="font-size:13px;margin-top:6px;color:#444">Add some products to get started</p></div>`;
    return;
  }
  let total=0;
  let rows=keys.map(id=>{
    const p=PRODUCTS.find(x=>x.id===id);
    const qty=cart[id];
    total+=p.price*qty;
    return `<div class="cart-item-row">
      <span class="ci-name">${p.name}</span>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="chgQty('${id}',-1)">−</button>
        <span class="qty-num">${qty}</span>
        <button class="qty-btn" onclick="chgQty('${id}',1)">+</button>
      </div>
      <span class="ci-price">${inr(p.price*qty)}</span>
      <button class="rm-btn" onclick="removeItem('${id}')" aria-label="Remove">✕</button>
    </div>`;
  }).join('');
  el.innerHTML=rows+`
    <div class="cart-footer">
      <div>
        <div class="cart-total-label">Total</div>
        <div class="cart-total-val">${inr(total)}</div>
      </div>
      <button class="checkout-btn" onclick="doCheckout()" id="checkout-btn">${loggedIn?'Place Order':'Login to Checkout'}</button>
    </div>`;
}

function chgQty(id,d){
  cart[id]=Math.max(1,cart[id]+d);
  updateBadge();
  renderCart();
}

function removeItem(id){
  const p=PRODUCTS.find(x=>x.id===id);
  delete cart[id];
  const btn=document.getElementById('ab-'+id);
  if(btn){btn.textContent='Add to Cart';btn.className='add-btn';}
  updateBadge();
  renderCart();
  toast(p.name+' removed');
}

function doCheckout(){
  if(!loggedIn){goTab('login');toast('Please log in first');return;}
  if(!Object.keys(cart).length){toast('Cart is empty!');return;}
  cart={};
  updateBadge();
  orderPlaced=true;
  renderProducts();
  renderCart();
}

function renderLogin(){
  const el=document.getElementById('login-area');
  if(loggedIn){
    el.innerHTML=`<div class="user-greeted">
      <div style="font-size:48px;margin-bottom:8px">🏋️</div>
      <div class="ug-name">${username}</div>
      <div style="font-size:14px;color:#aaa;margin-top:6px">Logged in & ready to lift</div>
      <div><span class="logout-link" onclick="doLogout()">Log out</span></div>
    </div>`;
    return;
  }
  el.innerHTML=`<div class="login-wrap">
    <h2>Login</h2>
    <input class="pf-input" id="l-user" placeholder="Username" autocomplete="off">
    <div style="position:relative">
      <input class="pf-input" id="l-pass" type="password" placeholder="Password">
    </div>
    <button class="login-btn" onclick="doLogin()">Login</button>
    <div class="login-msg" id="l-msg"></div>
    <div style="text-align:center;margin-top:14px;font-size:12px;color:#555">Demo: any username + password "1234"</div>
  </div>`;
}

function doLogin(){
  const u=document.getElementById('l-user').value.trim();
  const p=document.getElementById('l-pass').value.trim();
  const msg=document.getElementById('l-msg');
  if(!u||!p){msg.textContent='Please fill in all fields.';msg.className='login-msg err';return;}
  if(p!=='1234'){msg.textContent='Wrong password. Hint: try "1234"';msg.className='login-msg err';return;}
  loggedIn=true;
  username=u;
  msg.textContent='';
  toast('Welcome, '+u+'!');
  setTimeout(()=>{renderLogin();goTab('home');},400);
}

function doLogout(){
  loggedIn=false;username='';
  toast('Logged out');
  renderLogin();
}

function filterProds(q){
  PRODUCTS.forEach(p=>{
    const card=document.getElementById('card-'+p.id);
    if(card) card.classList.toggle('hidden',!p.name.toLowerCase().includes(q.toLowerCase()));
  });
}

let toastTid;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTid);
  toastTid=setTimeout(()=>t.classList.remove('show'),2400);
}

function animateStats(){
  const targets=[[9,'s1'],[12000,'s2'],[34500,'s3']];
  targets.forEach(([end,id])=>{
    let cur=0;
    const step=Math.ceil(end/40);
    const el=document.getElementById(id);
    const iv=setInterval(()=>{
      cur=Math.min(cur+step,end);
      el.textContent=cur.toLocaleString('en-IN');
      if(cur>=end)clearInterval(iv);
    },30);
  });
}

renderProducts();
animateStats();
</script>

</body>
</html>
